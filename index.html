<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Лаборатория измерений — учебный проект по физике, 7–8 класс. Приборы, тренажёр шкал, работы учащихся и рейтинг по критериям ЗЕРДЕ.">
<meta name="theme-color" content="#0B6F69">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 34 34%27%3E%3Crect width=%2734%27 height=%2734%27 rx=%278%27 fill=%27%230B6F69%27/%3E%3Cpath d=%27M7 26h20%27 stroke=%27%23fff%27 stroke-width=%271.6%27/%3E%3Cpath d=%27M17 26 23 8%27 stroke=%27%23FFB44D%27 stroke-width=%272.6%27 stroke-linecap=%27round%27/%3E%3Ccircle cx=%2717%27 cy=%2726%27 r=%272.4%27 fill=%27%23FFB44D%27/%3E%3C/svg%3E">
<title>Лаборатория измерений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF3EF; --grid:rgba(11,111,105,.085); --grid2:rgba(11,111,105,.17);
  --surface:#FBFDFB; --surface2:#E3ECE7; --line:#C4D3CB;
  --ink:#10231F; --ink2:#4A625B;
  --brand:#0B6F69; --brand-ink:#FFFFFF; --brand-soft:#D2EBE5;
  --read:#A64B00; --read-soft:#FBE7D3;
  --good:#1F7A3E; --warn:#9A5B00; --bad:#B3261E;
  --lcd-bg:#10201D; --lcd-ink:#FFB44D; --lcd-dim:#7E9A92;
  --gold:#B8860B; --silver:#6F7C86; --bronze:#A25A25;
  --shadow:0 1px 0 rgba(16,35,31,.05),0 6px 18px -10px rgba(16,35,31,.35);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A1E; --grid:rgba(90,210,190,.055); --grid2:rgba(90,210,190,.105);
    --surface:#12262B; --surface2:#19333A; --line:#29474F;
    --ink:#E4F0EC; --ink2:#9DB8B1;
    --brand:#43C6B5; --brand-ink:#062421; --brand-soft:#15393B;
    --read:#FFB44D; --read-soft:#3B2A17;
    --good:#6ED09A; --warn:#F0B05A; --bad:#FF8A80;
    --lcd-bg:#081513; --lcd-ink:#FFB44D; --lcd-dim:#6F8B83;
    --gold:#E6C25A; --silver:#B6C2CA; --bronze:#D9935B;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1E; --grid:rgba(90,210,190,.055); --grid2:rgba(90,210,190,.105);
  --surface:#12262B; --surface2:#19333A; --line:#29474F;
  --ink:#E4F0EC; --ink2:#9DB8B1;
  --brand:#43C6B5; --brand-ink:#062421; --brand-soft:#15393B;
  --read:#FFB44D; --read-soft:#3B2A17;
  --good:#6ED09A; --warn:#F0B05A; --bad:#FF8A80;
  --lcd-bg:#081513; --lcd-ink:#FFB44D; --lcd-dim:#6F8B83;
  --gold:#E6C25A; --silver:#B6C2CA; --bronze:#D9935B;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html body{
  margin:0; min-height:100%;
  font:15px/1.55 "IBM Plex Sans","Segoe UI",Roboto,"Noto Sans",system-ui,sans-serif;
  color:var(--ink); background-color:var(--bg);
  background-image:
    linear-gradient(var(--grid2) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid2) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:48px 48px,48px 48px,12px 12px,12px 12px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",Roboto,sans-serif;font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
svg{display:block}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:grid;grid-template-columns:auto 1fr auto;gap:8px 18px;align-items:center;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:19px;letter-spacing:.01em;display:block;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.2}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{appearance:none;border:0;background:none;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--ink2);white-space:nowrap;position:relative;border-radius:6px;display:flex;gap:7px;align-items:center}
.tab:hover{color:var(--ink);background:var(--surface2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:2px 2px 0 0;background:var(--read)}
.tab .cnt{font:500 11px "IBM Plex Mono",monospace;background:var(--surface2);color:var(--ink2);padding:1px 6px;border-radius:4px}
.ctl{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{appearance:none;border:0;background:none;padding:6px 10px;font:600 12.5px "IBM Plex Sans",sans-serif;cursor:pointer;color:var(--ink2);letter-spacing:.03em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:not([aria-pressed="true"]):hover{background:var(--surface2)}
.ibtn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:7px;width:36px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:18px;height:18px}
@media (max-width:860px){
  .top-in{grid-template-columns:1fr auto}
  .tabs{grid-column:1/-1;grid-row:2;margin-inline:-6px}
  .brand small{display:none}
}

/* ---------- generic ---------- */
main{padding-block:22px 64px;min-height:70vh}
.sec{margin-top:34px}
.sec-h{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 16px;margin-bottom:0}
.sec-h h2{font-size:26px}
.sec-h p{color:var(--ink2);max-width:62ch}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.ui{stroke-width:2}
.note svg,.chip svg{display:inline-block;vertical-align:-2px;width:15px;height:15px}
.drop svg{margin:0 auto 6px;width:24px;height:24px}
.ticks{height:9px;margin-top:10px;opacity:.55;
  background:
   repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 40px) 0 0/100% 9px no-repeat,
   repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 8px) 0 0/100% 5px no-repeat}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.muted{color:var(--ink2)}
.small{font-size:13px}
.kick{font:600 11.5px "IBM Plex Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px;background:var(--surface2);color:var(--ink2);border:1px solid transparent;white-space:nowrap}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.read{background:var(--read-soft);color:var(--read)}
.chip.ex{border:1px dashed var(--read);background:transparent;color:var(--read)}
.chip.warn{color:var(--warn);border-color:currentColor;background:transparent}
.btn{appearance:none;display:inline-flex;gap:7px;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;padding:9px 15px;border-radius:7px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{color:var(--bad);border-color:currentColor;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;flex:none}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.pill{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--ink2)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pill:not([aria-pressed="true"]):hover{background:var(--surface2)}
.note{border-left:3px solid var(--read);background:var(--read-soft);padding:10px 13px;border-radius:0 6px 6px 0;font-size:13.5px}
.note.brand{border-color:var(--brand);background:var(--brand-soft)}
.empty{padding:34px 16px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:8px;background:var(--surface)}

/* ---------- form controls ---------- */
label.f{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
label.f .h{font-weight:400;color:var(--ink2)}
.in,select.in,textarea.in{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;color:var(--ink);min-height:38px}
textarea.in{resize:vertical;min-height:84px;line-height:1.45}
.in:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand)}
.fld{margin-bottom:12px}
.fgrid{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.hint{font-size:12.5px;color:var(--ink2);margin-top:4px}
.err{color:var(--bad);font-size:13px;margin-top:6px}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center}
.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:0}
.hero .lead{font-size:17px;color:var(--ink2);max-width:52ch;margin-top:12px}
.hero .row{margin-top:18px}
.lcd{background:var(--lcd-bg);border-radius:10px;padding:16px 18px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),var(--shadow);color:var(--lcd-dim)}
.lcd-top{display:flex;justify-content:space-between;font:500 10.5px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.lcd-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-top:12px}
.lcd-v{font:600 clamp(30px,5vw,44px)/1 "IBM Plex Mono",monospace;color:var(--lcd-ink);text-shadow:0 0 14px rgba(255,180,77,.28)}
.lcd-l{font-size:12px;margin-top:3px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}

/* ---------- device cards ---------- */
.dev{display:flex;flex-direction:column;gap:10px;padding:14px;text-align:left;cursor:pointer;width:100%;appearance:none;font:inherit;color:inherit;transition:border-color .15s,transform .15s}
.dev:hover{border-color:var(--brand);transform:translateY(-2px)}
.dev-ic{width:54px;height:54px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.dev-ic svg{width:34px;height:34px}
.dev h3{font-size:19px}
.dev .ms{font-size:13px;color:var(--ink2)}
.dev-top{display:flex;gap:12px;align-items:center}
.diy .dev-ic{background:var(--read-soft);color:var(--read)}
.saf{counter-reset:s;display:grid;gap:8px;padding:0;margin:0;list-style:none}
.saf li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.saf li::before{content:counter(s);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--read-soft);color:var(--read);font:600 13px "IBM Plex Mono",monospace}
.linkrow{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--surface);color:var(--ink);width:min(940px,calc(100vw - 20px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden}
dialog[open]{display:flex;flex-direction:column}
dialog::backdrop{background:rgba(6,20,22,.62)}
.dlg-h{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.dlg-h h2{font-size:24px;flex:1;min-width:0;overflow-wrap:anywhere}
.dlg-b{overflow:auto;padding:16px 18px 20px;flex:1}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface2)}
.lb img{max-width:100%;max-height:calc(100dvh - 120px);margin:auto}
.big-ic{width:64px;height:64px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.big-ic svg{width:42px;height:42px}
.steps{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--ink2);font-size:13px}
.kv dd{margin:0}

/* ---------- works ---------- */
.wcard{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;text-align:left;padding:0;appearance:none;font:inherit;color:inherit;width:100%;transition:border-color .15s,transform .15s}
.wcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.wcover{height:130px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand);position:relative;overflow:hidden}
.wcover img{width:100%;height:100%;object-fit:cover}
.wcover svg{width:54px;height:54px;opacity:.8}
.wbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.wbody h3{font-size:19px;overflow-wrap:anywhere}
.badge-score{position:absolute;right:8px;top:8px;background:var(--lcd-bg);color:var(--lcd-ink);font:600 15px "IBM Plex Mono",monospace;padding:3px 9px;border-radius:5px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.badge-score small{color:var(--lcd-dim);font-size:10px;margin-left:2px}
.dots{display:flex;gap:4px}
.dot{width:14px;height:14px;border-radius:3px;border:1px solid var(--line);background:var(--surface);font:600 8.5px/12px "IBM Plex Mono",monospace;text-align:center;color:var(--ink2)}
.dot.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.crit{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:14px 0;border-top:1px solid var(--line)}
.crit:first-child{border-top:0}
.crit-n{font:600 12px "IBM Plex Mono",monospace;background:var(--ink);color:var(--surface);border-radius:4px;padding:2px 7px;height:fit-content;white-space:nowrap}
.crit-t{font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.crit-t small{font:500 12px "IBM Plex Mono",monospace;color:var(--ink2)}
.crit-b{grid-column:2;display:grid;gap:8px}
.crit-b p{white-space:pre-wrap;overflow-wrap:anywhere}
.lbl{font:600 11.5px "IBM Plex Sans",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
.att{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.att-i{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2);position:relative;min-height:88px;display:flex;flex-direction:column}
.att-i img{width:100%;height:96px;object-fit:cover;cursor:zoom-in}
.att-i .nm{font-size:12px;padding:6px 8px;overflow-wrap:anywhere;color:var(--ink2)}
.att-i button.x{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;display:grid;place-items:center}
.att-i .fileic{display:grid;place-items:center;height:60px;color:var(--brand)}
.att-i .fileic svg{width:28px;height:28px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--ink2);cursor:pointer;background:var(--surface)}
.drop:hover,.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{font:600 11.5px "IBM Plex Sans",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:9px 12px;background:var(--surface2);white-space:nowrap}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n,.tbl th.n{text-align:right}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:4px}
.bar.read>i{background:var(--read)}
.award{font-weight:600;font-size:12.5px;padding:2px 9px;border-radius:4px;border:1px solid currentColor;white-space:nowrap}
.award.a1{color:var(--gold)}.award.a2{color:var(--silver)}.award.a3{color:var(--bronze)}.award.a4{color:var(--brand)}.award.a0{color:var(--ink2);border-style:dashed}
.tile{padding:14px 16px}
.tile .v{font:600 30px/1.1 "IBM Plex Mono",monospace;color:var(--read)}
.tile .l{font-size:13px;color:var(--ink2);margin-top:4px}
.jury{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.jury input{width:72px;text-align:right}

/* ---------- lab ---------- */
.scalebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}
.scalebox svg{margin:auto;max-width:100%}
.sv-t{stroke:var(--ink);stroke-width:1.4;stroke-linecap:butt}
.sv-tx{fill:var(--ink);font:600 12px "IBM Plex Mono",monospace}
.sv-body{fill:var(--surface2);stroke:var(--ink2);stroke-width:1.2}
.sv-liq{fill:var(--read)}
.sv-glass{fill:var(--surface2);stroke:var(--ink2);stroke-width:1.4}
.sv-cur{stroke:var(--read);stroke-width:1.6;stroke-dasharray:4 3}
.sv-obj{fill:var(--brand);opacity:.85}
.sv-jaw{fill:var(--surface2);stroke:var(--ink);stroke-width:1.3}
.sv-hi{fill:var(--read);opacity:.25}
.qrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:12px}
.res{font:500 15px "IBM Plex Mono",monospace;background:var(--lcd-bg);color:var(--lcd-ink);padding:10px 12px;border-radius:6px;overflow-wrap:anywhere}
.fb{padding:10px 12px;border-radius:6px;margin-top:12px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.fb.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.fb.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.formula{font:500 15px "IBM Plex Mono",monospace;background:var(--surface2);padding:8px 10px;border-radius:6px;display:inline-block;margin-top:8px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(92vw,440px);pointer-events:none}
.tst{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:14px;pointer-events:auto}
.tst.bad{background:var(--bad);color:#fff}
.tst.good{background:var(--good);color:#fff}
.skel{height:130px;border-radius:8px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- scoring ---------- */
const critMax = CRIT.map(c => c.max);
function rebuildScores(){
  const by = {};
  S.scores.forEach(s => {
    if (!s || !s.key || !Array.isArray(s.c)) return;
    (by[s.key] = by[s.key] || []).push(s);
  });
  const map = {};
  Object.keys(by).forEach(k => {
    const list = by[k].map(s => {
      const c = critMax.map((m, i) => clamp(Number(s.c[i]) || 0, 0, m));
      return { juror:s.juror, c, total:c.reduce((a,b) => a+b, 0), comment:s.comment || '', at:s.at || 0, example:!!s.example };
    });
    const n = list.length;
    map[k] = { n, list, total: list.reduce((a,b) => a + b.total, 0) / n,
      crit: critMax.map((_, i) => list.reduce((a,b) => a + b.c[i], 0) / n) };
  });
  S.scoreMap = map;
}

/* ---------- series statistics (simplified school estimate) ---------- */
function roundSig(x){ return x === 0 ? 0 : +Number(x).toPrecision(1); }
function seriesStats(vals, cdiv){
  const n = vals.length;
  const mean = vals.reduce((a,b) => a+b, 0) / n;
  const dev = Math.max(...vals.map(v => Math.abs(v - mean)));
  const dInst = cdiv > 0 ? cdiv / 2 : 0;
  const abs = roundSig(Math.max(dInst, dev));
  const dec = abs > 0 ? Math.max(0, -Math.floor(Math.log10(abs))) : 2;
  return { n, mean, dev, dInst, abs, dec, rel: mean !== 0 && abs > 0 ? abs / Math.abs(mean) * 100 : NaN };
}
function seriesRecord(st, unit){
  return `x = ${st.mean.toFixed(st.dec).replace('.', ',')} ± ${st.abs.toFixed(st.dec).replace('.', ',')} ${unit || ''}`.trim();
}

function recordTraining(kind, ok){
  if (!S.dbOk || !S.me.id) return;
  const cur = S.training[S.me.id] || {};
  const stats = Object.assign({}, cur.stats);
  const st = Object.assign({ n:0, ok:0 }, stats[kind]);
  st.n++; if (ok) st.ok++;
  stats[kind] = st;
  const first = (cur.first || []).slice();
  if (first.length < 10) first.push(ok ? 1 : 0);
  const hist = (cur.hist || []).concat(ok ? 1 : 0).slice(-40);
  const nd = { stats, first, hist, at:Date.now() };
  S.training[S.me.id] = nd;
  BACKEND.saveTraining(nd);
}

const pick = a => a[Math.floor(Math.random() * a.length)];
function newQuestion(kind){
  if (kind === 'vern') { const m = 10 + Math.floor(Math.random() * 80), j = Math.floor(Math.random() * 10); return { kind, m, j, v:fix(m + j / 10) }; }
  const p = pick(PRESETS[kind]), N = Math.round((p.max - p.min) / p.d);
  let k; do { k = 1 + Math.floor(Math.random() * (N - 1)); } while (k % p.every === 0);
  return { kind, p, N, k, v:fix(p.min + k * p.d) };
}

function tickLoop(q, fnTick){
  for (let i = 0; i <= q.N; i++) {
    const lab = i % q.p.every === 0;
    const mid = !lab && q.p.every % 2 === 0 && i % (q.p.every / 2) === 0;
    fnTick(i, lab, mid);
  }
}
function svgRuler(q){
  const W = 640, x0 = 30, x1 = 610, ppu = (x1 - x0) / q.N, xv = x0 + q.k * ppu;
  let s = `<svg viewBox="0 0 ${W} 150" style="width:100%;min-width:560px" role="img" aria-label="${esc(tr('k_ruler'))}">`;
  s += `<rect class="sv-obj" x="${x0}" y="14" width="${xv - x0}" height="28" rx="3"/><line class="sv-cur" x1="${xv}" y1="42" x2="${xv}" y2="76"/>`;
  s += `<rect class="sv-body" x="${x0 - 16}" y="76" width="${x1 - x0 + 32}" height="62" rx="4"/>`;
  tickLoop(q, (i, lab, mid) => {
    const x = x0 + i * ppu, len = lab ? 26 : mid ? 18 : 12;
    s += `<line class="sv-t" x1="${x}" y1="76" x2="${x}" y2="${76 + len}"/>`;
    if (lab) s += `<text class="sv-tx" x="${x}" y="${76 + len + 16}" text-anchor="middle">${fnum(q.p.min + i * q.p.d)}</text>`;
  });
  return s + '</svg>';
}
function svgVertical(q){
  const yT = 44, yB = 336, Y = i => yB - (i / q.N) * (yB - yT), yk = Y(q.k), isT = q.kind === 'thermo';
  let s = `<svg viewBox="0 0 280 410" style="width:min(100%,300px)" role="img" aria-label="${esc(tr('k_' + q.kind))}">`;
  if (isT) {
    s += `<rect class="sv-glass" x="106" y="26" width="26" height="322" rx="13"/><circle class="sv-glass" cx="119" cy="362" r="28"/>`;
    s += `<circle class="sv-liq" cx="119" cy="362" r="18"/><rect class="sv-liq" x="113" y="${yk}" width="12" height="${362 - yk}"/>`;
    tickLoop(q, (i, lab, mid) => {
      const y = Y(i), len = lab ? 24 : mid ? 16 : 10;
      s += `<line class="sv-t" x1="142" y1="${y}" x2="${142 + len}" y2="${y}"/>`;
      if (lab) s += `<text class="sv-tx" x="${142 + len + 6}" y="${y + 4}">${fnum(q.p.min + i * q.p.d)}</text>`;
    });
    s += `<line class="sv-cur" x1="100" y1="${yk}" x2="180" y2="${yk}"/>`;
  } else {
    s += `<rect class="sv-glass" x="100" y="28" width="90" height="330" rx="6"/>`;
    s += `<rect x="101" y="${yk}" width="88" height="${357 - yk}" style="fill:var(--brand);opacity:.32"/><line class="sv-cur" x1="101" y1="${yk}" x2="189" y2="${yk}"/>`;
    tickLoop(q, (i, lab, mid) => {
      const y = Y(i), len = lab ? 26 : mid ? 17 : 11;
      s += `<line class="sv-t" x1="100" y1="${y}" x2="${100 + len}" y2="${y}"/>`;
      if (lab) s += `<text class="sv-tx" x="92" y="${y + 4}" text-anchor="end">${fnum(q.p.min + i * q.p.d)}</text>`;
    });
  }
  return s + '</svg>';
}
function svgVernier(q){
  const K = 20, start = q.m - 8, W = 600, X = mm => (mm - start) * K, v = q.m + q.j / 10, x0 = X(v);
  let s = `<svg viewBox="0 0 ${W} 190" style="width:100%;min-width:520px" role="img" aria-label="${esc(tr('k_vern'))}">`;
  s += `<rect class="sv-body" x="0" y="10" width="${W}" height="64"/>`;
  for (let mm = Math.ceil(start); mm <= Math.floor(start + 30); mm++) {
    const x = X(mm), len = mm % 10 === 0 ? 26 : mm % 5 === 0 ? 18 : 11;
    s += `<line class="sv-t" x1="${x}" y1="74" x2="${x}" y2="${74 - len}"/>`;
    if (mm % 10 === 0) s += `<text class="sv-tx" x="${x}" y="40" text-anchor="middle">${mm}</text>`;
  }
  s += `<rect class="sv-jaw" x="${x0 - 8}" y="74" width="${9 * K + 24}" height="68"/>`;
  for (let i = 0; i <= 10; i++) {
    const x = x0 + i * 0.9 * K, len = i % 5 === 0 ? 20 : 13;
    s += `<line class="sv-t" x1="${x}" y1="74" x2="${x}" y2="${74 + len}"/>`;
    s += `<text class="sv-tx" x="${x}" y="${74 + 36}" text-anchor="middle" style="font-size:10.5px">${i}</text>`;
  }
  s += `<text x="${x0 + 4.5 * K}" y="176" text-anchor="middle" class="sv-tx" style="font-weight:500;opacity:.7;font-size:11px">0,1 мм</text></svg>`;
  return s;
}

function checkTrainer(){
  const t = S.tr, q = t.q; if (!q || t.res) return;
  const rdRaw = ($('#tr-read') || {}).value || '', dvRaw = ($('#tr-div') || {}).value || '';
  const rd = parseNum(rdRaw), dv = parseNum(dvRaw);
  if (!isFinite(rd) || (q.kind !== 'vern' && !isFinite(dv))) { toast(tr('enter_num'), 'bad'); return; }
  let res;
  if (q.kind === 'vern') { const ok = Math.abs(rd - q.v) < 0.051; res = { ok, okRead:ok, rd, rdRaw, dvRaw }; }
  else {
    const okDiv = Math.abs(dv - q.p.d) < 1e-4, okRead = Math.abs(rd - q.v) < q.p.d * 0.26;
    res = { ok:okDiv && okRead, okDiv, okRead, dv, rd, dvRaw, rdRaw };
  }
  t.res = res; t.sess.n++; if (res.ok) t.sess.ok++;
  recordTraining(q.kind, res.ok);
  $('#trainer').outerHTML = trainerHTML();
}

function calcDivOut(){
  const a = parseNum(S.cal.a), b = parseNum(S.cal.b), n = parseNum(S.cal.n);
  if (!isFinite(a) || !isFinite(b) || !isFinite(n) || n <= 0 || b <= a) return `<span class="muted">—</span>`;
  const c = fix((b - a) / n);
  return `<div class="res">c = (${fnum(b)} − ${fnum(a)}) / ${fnum(n)} = ${fnum(c)}</div>
    <div class="res" style="margin-top:6px">Δ = c / 2 = ${fnum(fix(c / 2))}</div>`;
}

function trainingAggregate(){
  let att = 0, ok = 0, stu = 0, fa = 0, la = 0, hn = 0;
  Object.keys(S.training).forEach(id => {
    const d = S.training[id] || {}, st = d.stats || {};
    let n = 0, o = 0;
    Object.keys(st).forEach(k => { n += st[k].n || 0; o += st[k].ok || 0; });
    if (n) { stu++; att += n; ok += o; }
    if (n >= 20 && d.first && d.first.length >= 10 && d.hist && d.hist.length >= 10) {
      const f = d.first.slice(0, 10).reduce((a, b) => a + b, 0) / 10, l = d.hist.slice(-10).reduce((a, b) => a + b, 0) / 10;
      fa += f; la += l; hn++;
    }
  });
  return { att, ok, stu, hn, fa: hn ? fa / hn * 100 : 0, la: hn ? la / hn * 100 : 0 };
}

function statsBlock(vals, cdiv, unit){
  if (vals.length < 3) return `<span class="muted">${esc(tr('need3'))}</span>`;
  const st = seriesStats(vals, cdiv > 0 ? cdiv : 0);
  const row = (k, v) => `<tr><td>${esc(tr(k))}</td><td class="n mono">${v}</td></tr>`;
  return `<div class="tbl-w"><table class="tbl"><tbody>
    ${row('r_n', st.n)}${row('r_mean', fnum(st.mean, st.dec + 1))}${row('r_dev', fnum(st.dev, st.dec + 1))}
    ${st.dInst ? row('r_delta', fnum(st.dInst)) : ''}${row('r_abs', fnum(st.abs, st.dec))}${row('r_rel', isFinite(st.rel) ? fnum(st.rel, 1) + ' %' : '—')}
  </tbody></table></div>
  <div class="res" style="margin-top:8px">${esc(tr('r_rec'))}: ${esc(seriesRecord(st, unit))}</div>`;
}
function linkify(line){
  return String(line).split(/(https?:\/\/[^\s<>"']+)/g).map((part, i) => {
    if (i % 2 === 0) return esc(part);
    const u = part.replace(/[.,;:)\]]+$/, ''), tail = part.slice(u.length);
    return safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>${esc(tail)}` : esc(part);
  }).join('');
}
const fmtSize = b => b >= 1048576 ? fnum(b / 1048576, 1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';

  const cacheKey = docId + '/' + a.id;
  if (S.fc.has(cacheKey)) return S.fc.get(cacheKey);
  const parts = await BACKEND.readParts(docId, a);
  let out;
  if (a.kind === 'img') out = safeImg(parts[0]);
  else {
    const bin = atob(parts.join('')), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    out = new Blob([u8], { type:a.type || 'application/octet-stream' });
  }
  S.fc.set(cacheKey, out);
  return out;
}

const ASSET_EXT = { pdf:'application/pdf', mp4:'video/mp4', webm:'video/webm', csv:'text/csv', md:'text/markdown', json:'application/json', txt:'text/plain' };
const DB_EXT = ['pdf','docx','pptx','xlsx','csv','txt','md','json','zip','gif'];
async function loadBitmap(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file); } catch(e){} }
  return await new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); };
    im.onerror = () => rej(new Error(tr('up_type')));
    im.src = u;
  });
}
function drawJpeg(bmp, maxDim, q){
  const bw = bmp.naturalWidth || bmp.width, bh = bmp.naturalHeight || bmp.height, sc = Math.min(1, maxDim / Math.max(bw, bh));
  const w = Math.max(1, Math.round(bw * sc)), h = Math.max(1, Math.round(bh * sc));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
async function compressImage(f){
  const bmp = await loadBitmap(f);
  let dim = 1400, q = 0.8, url = '';
  for (let i = 0; i < 12; i++) {
    url = drawJpeg(bmp, dim, q);
    if (url.length <= 170000) break;
    q -= 0.1; if (q < 0.4) { q = 0.7; dim = Math.round(dim * 0.8); }

    return { tmp:uid('t'), name:f.name, type:'image/jpeg', kind:'img', size:Math.round(r.dataUrl.length * 0.75), dataUrl:r.dataUrl, thumb:r.thumb };
  }
  if (BACKEND.wantsAsset && BACKEND.wantsAsset(f, ext)) return { tmp:uid('t'), name:f.name, type:ASSET_EXT[ext], kind:'file', size:f.size, blob:f, store:'asset' };

  if (f.size > BACKEND.maxFile) throw new Error(tr('up_big'));

}

/* ============================================================

const BACKEND = (() => {
  const CFG = Object.assign({ API_URL:'', POLL_SECONDS:20, MAX_FILE_MB:5 }, window.LAB_CONFIG || {});

  /* ----- transport ----- */
  const fail = code => Object.assign(new Error(UI['e_' + code] ? tr('e_' + code) : tr('e_server') + ' (' + code + ')'), { code });

      const res = await fetch(CFG.API_URL, {
        method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, keepalive:!!o.keepalive,
